[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "firmsync"
version = "1.0.0"
description = "Calibrated 25-Year Satellite Fire Intelligence & Harmonization Platform for Northern Algeria"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "CC-BY-4.0" }
authors = [
    { name = "FIRMSync Team (NASA Space Apps Challenge 2026)" }
]
keywords = [
    "wildfire",
    "remote-sensing",
    "NASA-FIRMS",
    "MODIS",
    "VIIRS",
    "harmonization",
    "Algeria",
    "earth-science"
]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
    "geopandas>=1.0",
    "shapely>=2.0",
    "requests>=2.28",
    "huggingface_hub>=0.20",
    "python-dotenv>=1.0"
]

[project.scripts]
firmsync = "firmsync.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
